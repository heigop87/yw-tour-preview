<div id="map"><div class="pbox" id="pbox"><div class="plan" id="plan"><img id="planImg" alt=""><svg class="cone" id="cone" viewBox="-80 -80 160 160"><defs><radialGradient id="cg" cx="0" cy="0" r="56" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="hsl(264.5638 84.1808% 34.7059%)" stop-opacity=".38"/><stop offset="1" stop-color="hsl(264.5638 84.1808% 34.7059%)" stop-opacity="0"/></radialGradient></defs><path d="M0 0 L-39.6 -39.6 A56 56 0 0 1 39.6 -39.6 Z" fill="url(#cg)"/></svg><div class="tip" id="tip"></div></div></div><div class="floors" id="floors"></div><button class="close" id="close" aria-label="Close deck plan"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div><button class="hide" id="hide" aria-label="Hide deck plan"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M9 2.5 4.5 7 9 11.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<script type="module">
import { Viewer } from '@photo-sphere-viewer/core';
import { MarkersPlugin } from '@photo-sphere-viewer/markers-plugin';

const T = await (await fetch('tour-data.json')).json();
// screens.json (optional): video loops pinned to TV corners, { sceneId: [{ src, corners: [[x,y] TL, TR, BR, BL in pano px] }] }
const SCREENS = await fetch('screens.json').then(r => r.ok ? r.json() : {}).catch(() => ({}));
document.getElementById('title').textContent = T.title;
let cur = null, shownDeck = null;
// owner view swaps in heat panos through this hook
let panoFor = id => 'pano/' + T.scenes[id].file;

const viewer = new Viewer({
  container: 'viewer', panorama: 'pano/' + T.scenes[T.first].file,
  navbar: false, defaultZoomLvl: 0, mousewheelCompensation: true,
  loadingTxt: '', plugins: [[MarkersPlugin, {}]],
});
const markers = viewer.getPlugin(MarkersPlugin);

function showDeck(id) {
  shownDeck = id;
  const d = T.decks.find(d => d.id === id);
  document.querySelectorAll('#floors button').forEach(b => b.classList.toggle('on', b.dataset.d === id));
  document.getElementById('planImg').src = `deck_${id}.png`;
  document.querySelectorAll('.pin').forEach(p => p.remove());
  dispatchEvent(new CustomEvent('tour:deck', { detail: id }));
  for (const s of Object.values(T.scenes)) {
    if (s.deck !== id) continue;
    const b = document.createElement('button');
    b.className = 'pin' + (s.id === cur ? ' on' : '');
    b.style.left = (s.map[0] / d.w * 100) + '%';
    b.style.top = (s.map[1] / d.h * 100) + '%';
    b.setAttribute('aria-label', s.name); b.dataset.id = s.id;
    b.onmouseenter = () => { const t = document.getElementById('tip'); t.textContent = s.name; t.style.left = b.style.left; t.style.top = b.style.top; t.classList.add('show'); };
    b.onmouseleave = () => document.getElementById('tip').classList.remove('show');
    b.onclick = e => { e.stopPropagation(); go(s.id); };
    document.getElementById('plan').appendChild(b);
  }
}

// view cone: 45 deg wedge at the current pin, turned to where the user looks
function updateCone(yawRad) {
  const c = document.getElementById('cone'), s = T.scenes[cur];
  if (!s) return;
  const d = T.decks.find(d => d.id === s.deck);
  c.classList.toggle('show', shownDeck === s.deck);
  c.style.left = (s.map[0] / d.w * 100) + '%';
  c.style.top = (s.map[1] / d.h * 100) + '%';
  const yaw = (yawRad ?? viewer.getPosition().yaw) * 180 / Math.PI;
  c.style.transform = `rotate(${yaw - s.rot + (d.mapYaw ?? 97)}deg)`;
}
viewer.addEventListener('position-updated', e => updateCone(e.position.yaw));

function setLinks(s) {
  dropScreens();
  markers.clearMarkers();
  for (const l of s.links) markers.addMarker({
    id: l.id, position: { yaw: l.yaw + 'deg', pitch: l.pitch + 'deg' },
    html: '<div class="hop"></div>', size: { width: 56, height: 56 },
    tooltip: T.scenes[l.id].name, data: { go: l.id },
  });
  showScreens(SCREENS[s.id] || []);
}

// TV screens: PSV re-renders every display frame while a video layer exists. Instead the clip only plays while the TV
// is on screen and the tour re-renders once per video frame (30 fps), so the rest of the tour stays as light as a photo.
let screenIds = [];
// rot turns the clip in 90 degree steps clockwise, for clips filmed or exported sideways
// PSV lays the clip on the sphere as two flat triangles, so an angled TV bends along the diagonal.
// Put the 4 corners on the real flat screen plane instead (rays scaled so they form a parallelogram).
function fixPersp(m) {
  const p = m.threeMesh.geometry.getAttribute('position');
  const d = [0, 1, 3, 2].map(i => [p.getX(i), p.getY(i), p.getZ(i)]); // TL TR BR BL
  const R = Math.hypot(...d[0]);
  // t1*d1 - t2*d2 + t3*d3 = d0  (t0 = 1)
  const A = [0, 1, 2].map(r => [d[1][r], -d[2][r], d[3][r]]), b = d[0];
  const det = M => M[0][0] * (M[1][1] * M[2][2] - M[1][2] * M[2][1]) - M[0][1] * (M[1][0] * M[2][2] - M[1][2] * M[2][0]) + M[0][2] * (M[1][0] * M[2][1] - M[1][1] * M[2][0]);
  const D = det(A); if (Math.abs(D) < 1e-9) return;
  const t = [1, ...[0, 1, 2].map(c => det(A.map((row, r) => row.map((v, k) => k === c ? b[r] : v))) / D)];
  if (t.some(x => x <= 0)) return;
  const k = .5 / Math.max(...t);
  [0, 1, 3, 2].forEach((i, n) => { p.setX(i, d[n][0] * t[n] * k); p.setY(i, d[n][1] * t[n] * k); p.setZ(i, d[n][2] * t[n] * k); });
  p.needsUpdate = true; m.threeMesh.geometry.computeBoundingSphere(); viewer.needsUpdate();
}
// PSV's corner-layer crop over-zooms portrait clips; undo its repeat/offset and apply a true cover crop
function fixWrap(m) {
  fixPersp(m);
  const v = m.video, mat = m.threeMesh.material, r = mat.repeat;
  if (!v.videoWidth) return;
  const ir = v.videoWidth / v.videoHeight;
  // true screen shape from the flat plane: clip width runs TL to TR, height TL to BL
  const g = m.threeMesh.geometry.getAttribute('position'), P = i => [g.getX(i), g.getY(i), g.getZ(i)];
  const len = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  const lr = len(P(0), P(1)) / len(P(0), P(2));
  const h = lr < ir ? 1 - lr / ir : 0, w = lr > ir ? 1 - ir / lr : 0;
  r.set(1 - h, 1 - w); mat.offset.set(h / 2, w / 2); viewer.needsUpdate();
}
// mirror: a reflection of a TV; the corners are swapped left to right so the picture shows flipped, as in a real mirror
const screenPos = sc => { const c = sc.corners.map((_, i) => sc.corners[(i + 4 - (sc.rot || 0)) % 4]); return (sc.mirror ? [c[1], c[0], c[3], c[2]] : c).map(([x, y]) => ({ textureX: x, textureY: y })); };
// download and decode the next rooms' TV clips ahead of time, so the TV is on the wall the moment the room shows
const warm = new Map();  // src -> muted <video> on a blob URL, first frame decoded
function warmClips(id) {
  for (const sc of SCREENS[id] || []) if (sc.src && !warm.has(sc.src)) {
    warm.set(sc.src, null);
    fetch(sc.src).then(r => r.ok ? r.blob() : Promise.reject()).then(b => {
      const v = document.createElement('video');
      Object.assign(v, { muted: true, loop: true, playsInline: true, preload: 'auto', src: URL.createObjectURL(b) });
      v.load(); warm.set(sc.src, v);
    }).catch(() => warm.delete(sc.src));
  }
}
function dropScreens() {
  screenIds.forEach(id => { viewer.needsContinuousUpdate(true); markers.getMarkers().some(m => m.id === id) && markers.removeMarker(id, false); });
  screenIds = [];
}
function showScreens(list) {
  dropScreens();
  const tv = list.find(sc => !sc.mirror);
  // TVs first, then reflections, which reuse the TV's video so both show the same frame
  [...list.entries()].sort((a, b) => !!a[1].mirror - !!b[1].mirror).forEach(([i, sc]) => {
    if (sc.mirror && !tv) return;
    const id = 'screen' + i;
    const src = sc.mirror ? tv.src : sc.src, wv = warm.get(src);
    screenIds.push(id);
    markers.addMarker({ id, videoLayer: wv ? wv.src : src, autoplay: false, position: screenPos(sc) }, false);
    viewer.needsContinuousUpdate(false);
    const m = markers.getMarker(id), mat = m.threeMesh.material;
    if (sc.mirror) {
      const t = mat.map; t.image.removeAttribute('src'); t.image.load(); t.dispose();
      mat.map = markers.getMarker('screen' + list.indexOf(tv)).threeMesh.material.map;
      mat.side = 2; mat.needsUpdate = true;  // swapped corners turn the quad around; draw its back face too
      fixPersp(m);
      const a = mat.uniforms.alpha, v = m.video;
      const ready = () => { if (!screenIds.includes(id)) return; fixWrap(markers.getMarker(id)); a.value = .85; viewer.needsUpdate(); playVisible(); };
      if (v.readyState >= 2) ready(); else { a.value = 0; v.addEventListener('loadeddata', ready, { once: true }); }
      return;
    }
    if (wv) {  // swap in the warmed video so there is no load gap
      const t = mat.map; t.image.removeAttribute('src'); t.image.load();
      mat.map = new t.constructor(wv); mat.map.colorSpace = t.colorSpace; t.dispose();
    }
    const v = m.video; v.preload = 'auto'; v.loop = true;
    fixPersp(m);
    const a = mat.uniforms.alpha;
    const ready = () => { if (!screenIds.includes(id)) return; fixWrap(markers.getMarker(id)); a.value = 1; viewer.needsUpdate(); playVisible(); };
    if (v.readyState >= 2) ready(); else { a.value = 0; v.addEventListener('loadeddata', ready, { once: true }); }
    const tick = () => { if (!v.paused) { viewer.needsUpdate(); v.requestVideoFrameCallback(tick); } };
    v.onplay = () => v.requestVideoFrameCallback(tick);  // warmed videos are reused, so replace rather than stack
  });
  markers.renderMarkers();
  playVisible();
}
function playVisible() {
  const seen = new Map();  // a TV and its reflection share one video: play it while either is in view
  for (const id of screenIds) {
    const m = markers.getMarker(id);
    seen.set(m.video, seen.get(m.video) || (!document.hidden && viewer.renderer.isObjectVisible(m.threeMesh)));
  }
  for (const [v, on] of seen) {
    if (on && v.paused && v.readyState >= 2) v.play().catch(() => {});
    else if (!on && !v.paused) v.pause();
  }
}
viewer.addEventListener('position-updated', playVisible);
viewer.addEventListener('zoom-updated', playVisible);
document.addEventListener('visibilitychange', playVisible);

// where to look on arrival, by how you moved on the plan (bow is up, angles clockwise from the bow):
// forward: look where you are heading; side to side: look across the boat; aft: look back into the boat, not out to sea
function arrivalYaw(a, b) {
  if (a.deck !== b.deck) return null;
  const d = T.decks.find(d => d.id === b.deck), dx = b.map[0] - a.map[0], dy = b.map[1] - a.map[1];
  if (!dx && !dy) return null;
  const ang = (x, y) => Math.atan2(x, -y) * 180 / Math.PI;
  let deg;
  if (-dy > Math.abs(dx)) deg = ang(dx, dy);                       // forward
  else if (Math.abs(dx) >= Math.abs(dy)) deg = b.map[0] < d.w / 2 ? 90 : -90;  // across, toward the centreline
  else deg = Math.abs(b.map[1] - d.h / 2) < d.h * .15 ? ang(dx, dy)  // aft but still midships: keep going
    : ang(d.w / 2 - b.map[0], d.h / 2 - b.map[1]);                 // aft end: face the middle of the boat
  return (deg + b.rot - (d.mapYaw ?? 97)) * Math.PI / 180;
}

async function go(id, first) {
  const s = T.scenes[id], prev = T.scenes[cur];
  cur = id;
  if (!first) {
    const p = viewer.getPosition();
    const yaw = arrivalYaw(prev, s) ?? p.yaw + (s.rot - prev.rot) * Math.PI / 180;  // else keep the same heading on the boat
    dropScreens(); markers.renderMarkers();  // the old TV must not ride along onto the next room's wall
    warmClips(id);
    await viewer.setPanorama(await panoFor(id), { transition: { speed: 500, rotation: false, effect: 'fade' }, showLoader: false, position: { yaw, pitch: p.pitch } });
  }
  setLinks(s);
  s.links.forEach(l => warmClips(l.id));  // neighbours' TVs, so the next hop has them ready
  document.getElementById('spot').textContent = s.name;
  showDeck(s.deck);
  updateCone();
  dispatchEvent(new CustomEvent('tour:scene', { detail: id }));
}
markers.addEventListener('select-marker', e => e.marker.data?.go && !window.tour.hopDragged && go(e.marker.data.go));

// deck tabs: tap to go to the nearest spot on that deck
function nearestOn(deckId) {
  const here = T.scenes[cur], hd = T.decks.find(d => d.id === here.deck), td = T.decks.find(d => d.id === deckId);
  if (td.start && T.scenes[td.start]) return td.start;  // deck has a set entry spot (boat.json "start")
  const hy = here.map[1] / hd.h;
  let best = null, bd = Infinity;
  for (const s of Object.values(T.scenes)) {
    if (s.deck !== deckId) continue;
    const dist = Math.abs(s.map[1] / td.h - hy) + 0.3 * Math.abs(s.map[0] / td.w - here.map[0] / hd.w);
    if (dist < bd) { bd = dist; best = s.id; }
  }
  return best;
}
const floors = document.getElementById('floors');
for (const d of T.decks) {
  const b = document.createElement('button');
  b.textContent = d.label; b.dataset.d = d.id;
  b.onclick = () => { if (T.scenes[cur].deck !== d.id) go(nearestOn(d.id)); };
  floors.appendChild(b);
}
floors.classList.toggle('one', T.decks.length < 2);

// phone: the chevron sits in the bottom row, right of the deck tabs; with the plan hidden it slides to the corner
const hideBtn = document.getElementById('hide');
const placeHide = () => {
  const map = document.getElementById('map'), off = map.classList.contains('off');
  const r = (floors.offsetWidth ? floors : document.getElementById('pbox')).getBoundingClientRect();
  hideBtn.style.setProperty('--hl', off ? '12px' : (r.right - new DOMMatrix(getComputedStyle(map).transform).m41 + 8) + 'px');  // m41: map may still be sliding back
};
hideBtn.onclick = () => {
  const map = document.getElementById('map');
  if (!map.classList.contains('off'))  // slide the plan and tabs fully off screen
    map.style.setProperty('--off', -(Math.max(floors.getBoundingClientRect().right, document.getElementById('pbox').getBoundingClientRect().right) + 2) + 'px');
  const off = map.classList.toggle('off');
  hideBtn.classList.toggle('off', off);
  hideBtn.setAttribute('aria-label', off ? 'Show deck plan' : 'Hide deck plan');
  placeHide();
};
addEventListener('resize', placeHide); requestAnimationFrame(placeHide);

// touch has no hover: wake the map for a few seconds after a tap on it
let sleepT;
document.getElementById('map').addEventListener('touchstart', () => {
  const m = document.getElementById('map'); m.classList.add('awake');
  clearTimeout(sleepT); sleepT = setTimeout(() => m.classList.remove('awake'), 4000);
}, { passive: true });

// phone: pinch or double tap the plan to zoom it where it sits, drag to pan while zoomed
const mapEl = document.getElementById('map'), planEl = document.getElementById('plan');
const phone = matchMedia('(max-width:640px)');
let k = 1, tx = 0, ty = 0;
function setZoom(nk, mx, my) {  // mx,my: point in the plan's own box that stays put
  nk = Math.min(4, Math.max(1, nk));
  tx = mx - (mx - tx) * nk / k; ty = my - (my - ty) * nk / k; k = nk;
  const w = planEl.offsetWidth, h = planEl.offsetHeight;  // keep the zoomed plan filling its box
  const bw = Math.min(w * k, innerWidth - 24);  // zoomed, the box grows sideways up to the screen width
  const pb = document.getElementById('pbox'); pb.style.width = k > 1 ? bw + 'px' : ''; pb.classList.toggle('z', k > 1);
  tx = Math.min(0, Math.max(bw - w * k, tx)); ty = Math.min(0, Math.max(h * (1 - k), ty));
  planEl.style.setProperty('--k', k); planEl.style.setProperty('--tx', tx + 'px'); planEl.style.setProperty('--ty', ty + 'px');
}
document.getElementById('planImg').addEventListener('load', () => { k = 1; setZoom(1, 0, 0); });  // new deck starts unzoomed
const pts = new Map(); let last = null, lastTap = 0;
const local = (x, y) => { const r = planEl.getBoundingClientRect(); return [x - r.left + tx, y - r.top + ty]; };
planEl.addEventListener('pointerdown', e => {
  if (!phone.matches) return;  // fingers on a pin count too; a plain tap still opens the spot
  pts.set(e.pointerId, [e.clientX, e.clientY]); last = null;
  if (pts.size === 1) {
    const now = Date.now();
    if (now - lastTap < 300) { const [mx, my] = local(e.clientX, e.clientY); setZoom(k > 1.5 ? 1 : 2.5, mx, my); }
    lastTap = now;
  }
});
addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  const p = [...pts.values()];
  const cx = p.reduce((a, q) => a + q[0], 0) / p.length, cy = p.reduce((a, q) => a + q[1], 0) / p.length;
  const dist = p.length > 1 ? Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]) : 0;
  if (last) {
    if (k > 1 || p.length > 1) { tx += cx - last.cx; ty += cy - last.cy; }
    if (dist && last.dist) { const [mx, my] = local(cx, cy); setZoom(k * dist / last.dist, mx, my); }
    else setZoom(k, 0, 0);
  }
  last = { cx, cy, dist };
});
const up = e => { pts.delete(e.pointerId); last = null; };
addEventListener('pointerup', up); addEventListener('pointercancel', up);

// viewing analytics: one sample a second (spot + view direction), sent in batches
// embedded on a dealer site: guest view only, logo opens the full tour on YachtWay, visits tagged with the host site
const EMBED = window.top !== window.self || new URLSearchParams(location.search).has('embed');
const AO = location.ancestorOrigins;  // real parent origin where the browser has it, else the referrer
let REF = !EMBED ? '' : AO?.length ? new URL(AO[AO.length - 1]).host : document.referrer ? new URL(document.referrer).host : '';
if (REF === location.host) REF = '';  // our own previews are not embeds
if (EMBED) { document.body.classList.add('embed'); document.body.classList.toggle('outside', !!REF); document.getElementById('brand').href = document.querySelector('link[rel=canonical]')?.href || location.href.split('?')[0]; }
// full screen inside someone else's page; iPhone has no element full screen, so open the tour on its own there
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
document.getElementById('fs').onclick = () => {
  const d = document.documentElement;
  if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else if (d.requestFullscreen || d.webkitRequestFullscreen) (d.requestFullscreen || d.webkitRequestFullscreen).call(d);
  else open(location.href.split('?')[0], '_blank', 'noopener');
};
['fullscreenchange', 'webkitfullscreenchange'].forEach(t => document.addEventListener(t, () => document.body.classList.toggle('full', !!fsEl())));
// sites YachtWay turned off (fraud or misuse reports): show only a way to the tour on YachtWay
if (EMBED && REF) fetch('embeds-blocked.json').then(r => r.ok ? r.json() : []).then(list => {
  if (!list.some(b => REF === b || REF.endsWith('.' + b))) return;
  const g = document.createElement('div'); g.className = 'gone';
  g.innerHTML = `<div>This tour is shown on YachtWay.<br><a href="${document.getElementById('brand').href}" target="_top" rel="noopener">Open the tour on YachtWay</a></div>`;
  document.body.appendChild(g);
}).catch(() => {});
const TOUR = location.pathname.split('/').filter(Boolean)[0] || 'tour';
const SID = Math.random().toString(36).slice(2, 10);
const VID = localStorage.yw_vid ||= Math.random().toString(36).slice(2, 10);  // same browser across visits
let buf = [];
setInterval(() => {
  if (document.hidden || !cur || mapEl.classList.contains('big') || document.body.matches('.owner,.names,.screens')) return;
  const p = viewer.getPosition();
  buf.push([cur, Math.round(p.yaw * 1800 / Math.PI) / 10, Math.round(p.pitch * 1800 / Math.PI) / 10]);
}, 1000);
function flush() {
  if (!buf.length) return;
  navigator.sendBeacon('/t', JSON.stringify({ tour: TOUR, sid: SID, vid: VID, ref: REF, t: Date.now(), s: buf }));
  buf = [];
}
setInterval(flush, 10000);
addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => document.hidden && flush());

// guest / owner switch; owner view loads the analytics panel (sign-in gated in production)
// names: photographer tool for naming spots, only offered when the link has ?view=names
let ownerMod = null, namesMod = null, screensMod = null;
async function setView(v) {
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.body.classList.toggle('owner', v === 'owner');
  document.body.classList.toggle('names', v === 'names');
  const u = new URL(location); v === 'guest' ? u.searchParams.delete('view') : u.searchParams.set('view', v); history.replaceState(null, '', u);
  if (v === 'owner' && !ownerMod) ownerMod = await import('./owner.js');
  if (v === 'names' && !namesMod) namesMod = await import('./names.js');
  if (v === 'screens' && !screensMod) screensMod = await import('./screens.js');
  ownerMod?.toggle(v === 'owner');
  namesMod?.toggle(v === 'names');
  document.body.classList.toggle('screens', v === 'screens');
  screensMod?.toggle(v === 'screens');
}
document.querySelectorAll('#views button').forEach(b => b.onclick = () => setView(b.dataset.v));
// guests can share the link or put the tour on their own site; every host shows up in the YachtWay embeds list
const sheet = document.getElementById('sheet');
document.getElementById('share').onclick = async () => {
  const { embedPanel } = await import('./embed.js');
  const url = document.querySelector('link[rel=canonical]')?.href || location.origin + location.pathname;
  embedPanel(document.getElementById('sheetBody'), { name: T.title, url, guest: true });
  sheet.hidden = false;
};
document.getElementById('sheetX').onclick = () => sheet.hidden = true;
sheet.onclick = e => { if (e.target === sheet) sheet.hidden = true; };
const rep = document.getElementById('rep');
document.getElementById('report').onclick = () => { rep.hidden = !rep.hidden; rep.hidden || document.getElementById('repNote').focus(); };
rep.onsubmit = e => {
  e.preventDefault();
  navigator.sendBeacon('/embeds/report', JSON.stringify({ host: REF, tour: TOUR, note: document.getElementById('repNote').value }));
  rep.innerHTML = '<strong>Thank you.</strong> YachtWay will review this website.';
  setTimeout(() => rep.hidden = true, 2500);
};
window.tour = { T, viewer, go, updateCone, showScreens, screenPos, fixWrap, SCREENS, setScreens(o) { Object.keys(SCREENS).forEach(k => delete SCREENS[k]); Object.assign(SCREENS, o); }, get cur() { return cur; }, get deck() { return shownDeck; },
  setPanoFor(f) { panoFor = f; }, relabel() { setLinks(T.scenes[cur]); document.getElementById('spot').textContent = T.scenes[cur].name; }, async reload() { const p = viewer.getPosition(); await viewer.setPanorama(await panoFor(cur), { transition: { speed: 300, rotation: false, effect: 'fade' }, showLoader: false, position: p }); } };

viewer.addEventListener('ready', async () => { await go(T.first, true); const v = new URLSearchParams(location.search).get('view'); document.body.classList.toggle('can-name', ['names', 'screens'].includes(v)); setView(!EMBED && ['owner', 'names', 'screens'].includes(v) ? v : 'guest'); }, { once: true });
</script>
