<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>How the tour looks on your website | YachtWay</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff;color:#121216;font:16px/1.5 Figtree,system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;background:#121216;color:#fff;font-size:14px}
.bar b{font-weight:600}
.fake{border-bottom:1px solid #eee;padding:16px 24px;display:flex;justify-content:space-between;color:#727279}
.fake span:first-child{font-weight:600;color:#121216}
main{max-width:1040px;margin:0 auto;padding:32px 24px 80px}
h1{font:600 32px/40px Poppins,sans-serif;margin:0 0 8px}
.ph{height:14px;border-radius:7px;background:#f2f2f5;margin:10px 0}
</style>
</head>
<body>
<div class="bar"><b>Preview: how the tour looks on your website</b></div>
<div class="fake"><span>Your website</span><span>Home &nbsp; Inventory &nbsp; Contact</span></div>
<main>
<h1 id="h"></h1>
<div class="ph" style="width:70%"></div><div class="ph" style="width:55%;margin-bottom:24px"></div>
<div id="tour"></div>
<div class="ph" style="width:80%;margin-top:32px"></div><div class="ph" style="width:60%"></div>
</main>
<script>
const q = new URLSearchParams(location.search), name = q.get('name') || 'Yacht';
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
document.getElementById('h').textContent = name;
document.getElementById('tour').innerHTML = `<style>.yw-tour{position:relative;width:100%;aspect-ratio:16/9}@media (max-width:700px){.yw-tour{aspect-ratio:auto;height:80vh}}</style>
<div class="yw-tour"><iframe src="./?embed=1" title="${esc(name)} 360 virtual tour" style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:12px" allow="fullscreen; autoplay; xr-spatial-tracking" allowfullscreen></iframe></div>
<p style="font:14px/1.4 sans-serif;margin:8px 0 0"><a href="./">${esc(name)} 360 virtual tour</a> by <a href="https://www.yachtway.com">YachtWay</a></p>`;
</script>
</body>
</html>
